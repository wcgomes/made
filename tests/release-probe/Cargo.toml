# Standalone Velopack probe (add-release-auto-update tasks 1.1-1.8).
# Not a workspace member: the empty [workspace] table keeps it out of the
# product build, lockfile and lint. Removed by tasks 10.1-10.3.
[package]
name = "release-probe"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[[bin]]
name = "made-app"
path = "src/main.rs"

[dependencies]
# public-utils exposes bundle::Manifest, which a custom UpdateSource must name.
velopack = { version = "=1.2.161", features = ["public-utils"] }
ureq = "3.4"
serde_json = "1"
semver = "1"
url = "2"
