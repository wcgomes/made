name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: Format and clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libegl1-mesa-dev \
            libgl1-mesa-dev \
            libvulkan-dev

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: lint

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Build and test (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            artifact: made-macos-arm64
            exe: ""
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: made-macos-x64
            exe: ""
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact: made-linux-x64
            exe: ""
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            artifact: made-windows-x64
            exe: ".exe"
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libegl1-mesa-dev \
            libgl1-mesa-dev \
            libvulkan-dev

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build the workspace
        run: cargo build --workspace --locked --target ${{ matrix.target }}

      - name: Test the workspace
        run: cargo test --workspace --locked --no-fail-fast --target ${{ matrix.target }}

      - name: Stage the development binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/${{ matrix.target }}/debug/made-app${{ matrix.exe }}" "dist/made-app${{ matrix.exe }}"

      - name: Upload the development binary
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # The plugin is platform-neutral TypeScript; one Linux runner is
  # representative. Native OpenCode distribution checks live in the per-OS
  # smoke workflows.
  plugin:
    name: OpenCode plugin tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: plugins/opencode-made/package-lock.json

      - name: Install plugin dependencies
        working-directory: plugins/opencode-made
        run: npm ci

      - name: Test the plugin
        working-directory: plugins/opencode-made
        run: npm test

      - name: Typecheck the plugin
        working-directory: plugins/opencode-made
        run: npm run typecheck
