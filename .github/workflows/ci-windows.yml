name: Windows native smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  windows-native:
    name: Windows x64 build, ConPTY, and app smoke
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-x64

      - name: Build the workspace
        run: cargo build --workspace --locked

      - name: Run Windows platform contract tests
        run: cargo test -p made-platform --test contract --locked

      - name: Run PTY/ConPTY contract tests
        run: cargo test -p made-terminal --test pty --locked

      - name: Install Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # Native OpenCode v2 is not guaranteed to be installable on a hosted
      # runner. This step attempts it and records the result; the summary step
      # below states plainly when the TUI was not validated.
      - name: Try native OpenCode v2
        id: opencode
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path logs | Out-Null
          try {
            npm install --global opencode-ai@2 2>&1 |
              Tee-Object -FilePath logs\opencode-install.log
            if ($LASTEXITCODE -ne 0) {
              "installed=false" >> $env:GITHUB_OUTPUT
              exit 1
            }

            $version = ((& opencode --version 2>&1) | Select-Object -First 1)
            $opencodeExit = $LASTEXITCODE
            if ($null -eq $version) {
              $version = ""
            }
            $version = $version.ToString().Trim()
            $version | Set-Content logs\opencode-version.log

            if ($opencodeExit -eq 0 -and $version -match '(^|[^0-9])2\.') {
              "installed=true" >> $env:GITHUB_OUTPUT
              "version=$version" >> $env:GITHUB_OUTPUT
            } else {
              "installed=false" >> $env:GITHUB_OUTPUT
              exit 1
            }
          } catch {
            $_ | Out-String | Add-Content logs\opencode-install.log
            "installed=false" >> $env:GITHUB_OUTPUT
            exit 1
          }

      # The hidden `--smoke-test` entry point is owned by the app UI task. This
      # workflow invokes it; it does not implement the mode.
      - name: Run the app smoke test
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path logs | Out-Null
          & .\target\debug\made-app.exe --smoke-test 2>&1 |
            Tee-Object -FilePath logs\windows-smoke.log
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Record native OpenCode TUI validation status
        if: always()
        shell: pwsh
        env:
          OPENCODE_INSTALLED: ${{ steps.opencode.outputs.installed }}
          OPENCODE_VERSION: ${{ steps.opencode.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force -Path logs | Out-Null
          if ($env:OPENCODE_INSTALLED -eq "true") {
            $lines = @(
              "## Windows native OpenCode TUI: manual validation required",
              "",
              "A native OpenCode v2 binary was installed on the runner: $env:OPENCODE_VERSION",
              "Hosted Windows runners do not provide an interactive desktop, so the OpenCode",
              "TUI was NOT driven inside the Made terminal by this job.",
              "",
              "Manual validation required on Windows x64:",
              "1. Run Made from an interactive desktop session with native OpenCode v2 on PATH.",
              "2. Run ``opencode`` in the Made terminal and confirm the TUI renders and accepts input.",
              "3. Switch between two sessions in different worktrees and confirm explorer follow,",
              "   session-map focus, preview, copy/paste, resize, and IME behavior."
            )
            Write-Host "::notice title=Native OpenCode v2 installed::TUI interaction remains a manual validation step."
          } else {
            $lines = @(
              "## Windows native OpenCode TUI: NOT VALIDATED IN CI",
              "",
              "Native OpenCode v2 was not installable on this runner. The TUI smoke did not run,",
              "so this job does not claim Windows OpenCode v2 support as validated.",
              "",
              "Manual validation required on Windows x64:",
              "1. Install the native OpenCode v2 distribution (not WSL) and confirm",
              "   ``opencode --version`` reports 2.x.",
              "2. Run Made from an interactive desktop session and start ``opencode`` in its terminal.",
              "3. Confirm the TUI, session follow across two worktrees, session-map focus, preview,",
              "   ConPTY resize, copy/paste, and IME behavior.",
              "",
              "See the uploaded logs for the attempted installation output."
            )
            Write-Host "::warning title=Native OpenCode v2 manual validation required::The hosted runner could not validate the OpenCode v2 TUI; see the job summary and artifact."
          }

          $lines | Set-Content logs\opencode-manual-validation.txt
          $lines | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Upload Windows smoke logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: made-windows-smoke-logs
          path: logs/
          if-no-files-found: warn
          retention-days: 14
