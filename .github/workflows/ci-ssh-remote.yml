name: SSH remote companions

# Headless companion builds for the four approved remote targets, plus the
# native askpass helper for each desktop host. Packaging consumes these
# artifacts in the same workflow run. Nothing in this workflow publishes a
# companion for download at connection time.

on:
  push:
    branches: [release/v0.1.0] # TEMP release/v0.1.0
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        description: Release build (release.yml); restores no cache.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ssh-remote-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  linux-companion:
    name: Linux companion glibc 2.31 (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform: linux/amd64
            askpass: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux/arm64
            askpass: false
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache the glibc 2.31 build
        if: ${{ !inputs.release }}
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .cargo-home
            target-glibc231
          key: glibc231-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            glibc231-${{ matrix.target }}-

      # The runner is ubuntu-24.04 (glibc 2.39). Compilation and the runtime
      # smoke happen in Debian 11, whose libc is 2.31. This is target-native
      # execution, not a cross-compiler and not the host toolchain.
      - name: Build and test the companion on glibc 2.31
        # A hung test fails here within minutes instead of stalling a release.
        timeout-minutes: 30
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          docker run --rm \
            --platform "${{ matrix.platform }}" \
            -v "$GITHUB_WORKSPACE:/src" \
            -w /src \
            -e TARGET \
            -e CARGO_HOME=/src/.cargo-home \
            -e CARGO_TARGET_DIR=/src/target-glibc231 \
            -e CARGO_TERM_COLOR=always \
            rust:1-bullseye@sha256:4730e387a220a08a365c77da3096544dde214f9d796c16284d4be45438cad4a9 \
            bash .github/scripts/build-linux-companion.sh
          sudo chown -R "$(id -u):$(id -g)" dist
          if [ -d target-glibc231 ]; then sudo chown -R "$(id -u):$(id -g)" target-glibc231; fi
          if [ -d .cargo-home ]; then sudo chown -R "$(id -u):$(id -g)" .cargo-home; fi

      - name: Upload the Linux companion
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ssh-companion-${{ matrix.target }}
          path: dist/ssh-companion-${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 14

      # Desktop askpass matches the ubuntu-24.04 made-app, not the remote
      # glibc 2.31 companion. There is no aarch64 Linux desktop package.
      - name: Install Rust stable
        if: matrix.askpass
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        if: matrix.askpass && !inputs.release
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: askpass-${{ matrix.target }}

      - name: Build the native Linux askpass
        if: matrix.askpass
        env:
          TARGET: ${{ matrix.target }}
        run: bash .github/scripts/stage-askpass.sh

      - name: Upload the native Linux askpass
        if: matrix.askpass
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ssh-askpass-${{ matrix.target }}
          path: dist/ssh-askpass-${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 14

  macos-companion:
    name: macOS companion 12.0 (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        if: ${{ !inputs.release }}
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: companion-${{ matrix.target }}

      - name: Build and test the headless companion
        timeout-minutes: 30
        env:
          TARGET: ${{ matrix.target }}
        run: bash .github/scripts/build-macos-companion.sh

      - name: Upload the macOS companion
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ssh-companion-${{ matrix.target }}
          path: dist/ssh-companion-${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 14

      - name: Upload the native macOS askpass
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ssh-askpass-${{ matrix.target }}
          path: dist/ssh-askpass-${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 14

  windows-askpass:
    name: Windows askpass (x86_64-pc-windows-msvc)
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo
        if: ${{ !inputs.release }}
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: askpass-x86_64-pc-windows-msvc

      - name: Build the native Windows askpass
        shell: bash
        env:
          TARGET: x86_64-pc-windows-msvc
        run: bash .github/scripts/stage-askpass.sh

      - name: Upload the native Windows askpass
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ssh-askpass-x86_64-pc-windows-msvc
          path: dist/ssh-askpass-x86_64-pc-windows-msvc/
          if-no-files-found: error
          retention-days: 14

  # One bounded regression check for the acceptance harness. It certifies the
  # real loopback protocol surface only; it is not a native GUI or live-matrix
  # claim. The staged glibc 2.31 x86_64 companion is downloaded, never rebuilt.
  ssh-smoke:
    name: SSH smoke (isolated loopback)
    needs: linux-companion
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare isolated sshd
        run: |
          set -euo pipefail
          if ! command -v sshd >/dev/null 2>&1 && [ ! -x /usr/sbin/sshd ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends openssh-server
          fi
          # Ubuntu's sshd requires its privilege-separation directory even when
          # it runs as the unprivileged runner account on a high port.
          sudo mkdir -p /run/sshd
          sudo chmod 0755 /run/sshd
          sshd -V 2>&1 | sed -n '1p' || true

      - name: Download the staged x86_64 Linux companion
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ssh-companion-x86_64-unknown-linux-gnu
          path: ${{ runner.temp }}/ssh-companion

      - name: Verify the companion artifact
        run: |
          set -euo pipefail
          if [ -z "${RUNNER_TEMP:-}" ]; then
            echo "RUNNER_TEMP is empty; refusing artifact verification" >&2
            exit 1
          fi
          cd "$RUNNER_TEMP/ssh-companion"
          sha256sum -c SHA256SUMS
          # Artifact upload/download does not preserve file modes.
          chmod 755 made-remote plugins/grok-made/hooks/bin/made-grok-status
          test -x made-remote
          test -x plugins/grok-made/hooks/bin/made-grok-status
          # SHA256SUMS and manifest.json are produced by the same build, so the
          # manifest's target/linkage fields plus the actual ELF identity are
          # what tie the bytes to the expected glibc 2.31 x86_64 companion.
          file_output="$(file made-remote)"
          printf '%s\n' "$file_output"
          case "$file_output" in
            *"ELF 64-bit LSB"*"x86-64"*) ;;
            *)
              echo "made-remote is not an x86-64 ELF: $file_output" >&2
              exit 1
              ;;
          esac
          # The staged grok-made hook is a native executable for the same
          # target, never a script.
          hook_output="$(file plugins/grok-made/hooks/bin/made-grok-status)"
          printf '%s\n' "$hook_output"
          case "$hook_output" in
            *"ELF 64-bit LSB"*"x86-64"*) ;;
            *)
              echo "made-grok-status is not an x86-64 ELF: $hook_output" >&2
              exit 1
              ;;
          esac
          python3 - <<'PY'
          import json
          import pathlib

          manifest = json.loads(pathlib.Path('manifest.json').read_text())
          assert manifest['schema'] == 1, manifest
          assert manifest['target'] == 'x86_64-unknown-linux-gnu', manifest
          assert manifest['profile'] == 'release', manifest
          linkage = manifest['linkage']
          assert linkage == {'kind': 'glibc', 'system': '2.31',
                             'max_symbol': '2.31'}, linkage
          entry = next(item for item in manifest['files']
                       if item['name'] == 'made-remote')
          assert entry['size'] == pathlib.Path('made-remote').stat().st_size, entry
          hook = next(item for item in manifest['files']
                      if item['name'] == 'plugins/grok-made/hooks/bin/made-grok-status')
          hook_path = pathlib.Path('plugins/grok-made/hooks/bin/made-grok-status')
          assert hook['size'] == hook_path.stat().st_size, hook
          assert len(manifest['files']) == 10, manifest['files']
          PY

      - name: Harness contract tests
        working-directory: tests/ssh
        run: python3 test_harness.py

      - name: Real SSH companion capabilities
        working-directory: tests/ssh
        env:
          PROBE: ${{ runner.temp }}/ssh-companion/made-remote --probe
        run: python3 parity.py capabilities --frontend "$PROBE"

      - name: Real SSH 60s loss and same-PID reattach
        working-directory: tests/ssh
        env:
          FRONTEND: ${{ runner.temp }}/ssh-companion/made-remote --stdio
        run: python3 parity.py survival --frontend "$FRONTEND"

      - name: Grok parity through real companion entry points
        working-directory: tests/ssh
        env:
          HOST_COMPANION: ${{ runner.temp }}/ssh-companion/made-remote
        run: python3 parity.py grok-parity --host-companion "$HOST_COMPANION"

      - name: Clean up isolated SSH fixtures
        if: always()
        shell: bash
        run: |
          set -u
          if [ -z "${RUNNER_TEMP:-}" ]; then
            echo "RUNNER_TEMP is empty; refusing cleanup" >&2
            exit 1
          fi
          patterns=("$RUNNER_TEMP/made-ssh-" "$RUNNER_TEMP/made-container-"
                    "$RUNNER_TEMP/ssh-companion/made-remote")
          pids=""
          for pattern in "${patterns[@]}"; do
            found="$(pgrep -f -- "$pattern" || true)"
            if [ -n "$found" ]; then pids="$pids $found"; fi
          done
          if [ -n "${pids// /}" ]; then
            kill $pids 2>/dev/null || true
            sleep 1
          fi
          remaining=""
          for pattern in "${patterns[@]}"; do
            found="$(pgrep -f -- "$pattern" || true)"
            if [ -n "$found" ]; then remaining="$remaining $found"; fi
          done
          if [ -n "${remaining// /}" ]; then
            kill -9 $remaining 2>/dev/null || true
          fi
          rm -rf -- "$RUNNER_TEMP"/made-ssh-* "$RUNNER_TEMP"/made-container-* \
            "$RUNNER_TEMP/ssh-companion"
          left_dirs="$(find "$RUNNER_TEMP" -maxdepth 1 \
            \( -name 'made-ssh-*' -o -name 'made-container-*' -o -name 'ssh-companion' \) \
            -print 2>/dev/null)"
          if [ -n "$left_dirs" ]; then
            echo "isolated SSH fixture directories survived cleanup:" >&2
            printf '%s\n' "$left_dirs" >&2
            exit 1
          fi
          leftovers=""
          for pattern in "${patterns[@]}"; do
            found="$(pgrep -f -- "$pattern" || true)"
            if [ -n "$found" ]; then leftovers="$leftovers $found"; fi
          done
          if [ -n "${leftovers// /}" ]; then
            echo "isolated SSH fixture processes survived cleanup:$leftovers" >&2
            exit 1
          fi

      - name: Record the acceptance boundary
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          {
            echo '## SSH smoke boundary'
            echo ''
            if [ "$JOB_STATUS" = 'success' ]; then
              echo '- Certified here: real OpenSSH loopback with isolated HOME, config, and known_hosts; the staged x86_64 glibc 2.31 companion; companion Capabilities; a real 60s owned-SSH loss with the same shell PID on reattach; and Grok fixture parity through real companion entry points.'
            else
              echo "- NOT certified: this job concluded \`$JOB_STATUS\`. No scenario result from this run is certified, and every claim below remains UNVERIFIED."
            fi
            echo '- Not certified here: native GUI behavior, real grok or OpenCode executables, auth-fault/netem matrices, or the live multi-host SSH matrix.'
            echo '- Companion provenance: artifact `ssh-companion-x86_64-unknown-linux-gnu` from the glibc 2.31 linux-companion job.'
          } >> "$GITHUB_STEP_SUMMARY"
