name: Release probes

# Velopack and self-containment probes for add-release-auto-update tasks
# 1.3-1.7. Manually triggered; the outcomes are recorded by task 1.8 and the
# workflow is removed by task 10.3. Nothing here publishes anything.

on:
  workflow_dispatch:
  push:
    branches: [release/v0.1.0] # TEMP release/v0.1.0
    paths:
      - tests/release-probe/**
      - .github/workflows/release-probe.yml

permissions:
  contents: read

concurrency:
  group: release-probe-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  VPK_VERSION: "1.2.161"
  # Candidate FUSE-less runtime for the 1.4 fallback (A), pinned by digest.
  URUNTIME_URL: https://github.com/VHSgunzo/uruntime/releases/download/v0.8.1/uruntime-appimage-squashfs-x86_64
  URUNTIME_SHA256: 2153e68d63f570c7ebe3d1f38df0fa16814f34d839c5cce2ee42667e327708e8

jobs:
  velopack:
    name: Velopack probe (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            probe_os: linux
            channel: linux-x64
            label: linux-x64
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04
            probe_os: linux
            channel: linux-x64
            label: linux-x64
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            probe_os: macos
            channel: osx-arm64
            label: macos-arm64
            target: aarch64-apple-darwin
          - os: macos-15-intel
            probe_os: macos
            channel: osx-x64
            label: macos-x64
            target: x86_64-apple-darwin
          - os: windows-2025
            probe_os: windows
            channel: win-x64
            label: windows-x64
            target: x86_64-pc-windows-msvc
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x

      - name: Install vpk
        shell: bash
        run: |
          dotnet tool install -g vpk --version "$VPK_VERSION"
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Install squashfs tools and the fallback runtime
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends squashfs-tools
          curl -fsSL -o "$RUNNER_TEMP/uruntime" "$URUNTIME_URL"
          echo "$URUNTIME_SHA256  $RUNNER_TEMP/uruntime" | sha256sum -c -
          chmod 755 "$RUNNER_TEMP/uruntime"

      - name: Build the probe
        shell: bash
        run: cargo build --release --locked --manifest-path tests/release-probe/Cargo.toml --target ${{ matrix.target }}

      - name: Run the probe harness
        shell: bash
        run: |
          set -euo pipefail
          exe="tests/release-probe/target/${{ matrix.target }}/release/made-app"
          if [ "$RUNNER_OS" = "Windows" ]; then exe="$exe.exe"; fi
          py=python3; command -v python3 >/dev/null 2>&1 || py=python
          "$py" tests/release-probe/probe.py --os ${{ matrix.probe_os }} --channel ${{ matrix.channel }} \
            --os-label ${{ matrix.label }} --exe "$exe" --work "$RUNNER_TEMP/probe" \
            --results "$RUNNER_TEMP/probe-${{ matrix.os }}.json" \
            ${{ runner.os == 'Linux' && '--fallback-runtime "$RUNNER_TEMP/uruntime"' || '' }}

      - name: Upload probe results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: probe-${{ matrix.os }}
          path: ${{ runner.temp }}/probe-${{ matrix.os }}.json
          if-no-files-found: warn

  channels:
    name: Channel feed names do not collide
    needs: velopack
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: results
      - name: Compare feed file names across channels
        run: |
          python3 - <<'PY'
          import json, pathlib, collections
          owners = collections.defaultdict(set)
          for path in pathlib.Path("results").rglob("probe-*.json"):
              data = json.loads(path.read_text())
              check = data["checks"].get("1.7 channel feed files", {})
              for name in check.get("files", []):
                  owners[name].add(data["channel"])
          collisions = {name: sorted(chs) for name, chs in owners.items() if len(chs) > 1}
          print(json.dumps({"files": {k: sorted(v) for k, v in owners.items()}, "collisions": collisions}, indent=2))
          raise SystemExit(1 if collisions else 0)
          PY

  windows-crt:
    name: Windows static CRT (1.6)
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release binaries with the static CRT
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked -p made-app -p made-grok-hook
          cargo build --release --locked -p made-platform --bin made-askpass --no-default-features
      - name: Assert no MSVC runtime imports
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -Last 1
          $bad = $false
          foreach ($bin in 'made-app.exe', 'made-askpass.exe', 'made-grok-status.exe') {
            $deps = & $dumpbin.FullName /dependents "target\release\$bin" | Where-Object { $_ -match '\.dll\s*$' } | ForEach-Object { $_.Trim() }
            Write-Host "$bin -> $($deps -join ', ')"
            if ($deps | Where-Object { $_ -match '^(VCRUNTIME|MSVCP|api-ms-win-crt-)' }) { $bad = $true }
          }
          if ($bad) { exit 1 }
      - name: Run the static-CRT smoke test
        shell: pwsh
        run: |
          & .\target\release\made-app.exe --smoke-test
          exit $LASTEXITCODE
