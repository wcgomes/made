name: Development artifacts

on:
  push:
    branches: [main, release/v0.1.0] # TEMP release/v0.1.0
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: artifacts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Companion builds are a dependency of packaging. A missing companion fails
  # this workflow; the desktop app does not download one when connecting.
  ssh-remote:
    name: Build SSH companions
    uses: ./.github/workflows/ci-ssh-remote.yml

  package:
    name: Package development build (${{ matrix.target }})
    needs: ssh-remote
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            exe: ""
          - os: macos-15-intel
            target: x86_64-apple-darwin
            exe: ""
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            exe: ""
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            exe: ".exe"
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libegl1-mesa-dev \
            libgl1-mesa-dev \
            libvulkan-dev

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: artifacts-${{ matrix.target }}

      - name: Build the workspace
        run: cargo build --workspace --locked --target ${{ matrix.target }}

      # The shipped hook is the release build for the host target, staged
      # below into plugins/grok-made; no interpreter runs it.
      - name: Build the native Grok hook
        run: cargo build -p made-grok-hook --locked --release --target ${{ matrix.target }}

      - name: Install Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # Development artifacts only: debug binaries, the app-owned OpenCode
      # plugin package, the shipped Grok plugin package, README, and version
      # metadata. Companions and the native askpass are added after this step;
      # they do not replace it.
      # No signing, notarization, installer, or auto-update payload is produced.
      - name: Stage the development artifact
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          EXE: ${{ matrix.exe }}
        run: |
          set -euo pipefail
          stage="dist/made-development-${TARGET}"
          mkdir -p "$stage/plugins"
          cp "target/${TARGET}/debug/made-app${EXE}" "$stage/"
          cp README.md Cargo.toml Cargo.lock rust-toolchain.toml "$stage/"
          # Release AppPaths resolves the app-owned plugin at
          # <install_root>/plugins/opencode-made, so the artifact root must
          # contain plugins/opencode-made rather than plugin/opencode-made.
          cp -R plugins/opencode-made "$stage/plugins/opencode-made"
          rm -rf "$stage/plugins/opencode-made/node_modules"
          test -f "$stage/plugins/opencode-made/package.json"
          # The shipped grok-made package rides in every desktop package so
          # both the local install and the staged remote copy never download.
          # It is the repository source plus the host-target native hook,
          # staged by the same script that stages the remote copies.
          bash .github/scripts/stage-grok-plugin.sh "$TARGET" \
            "target/${TARGET}/release/made-grok-status${EXE}" "$stage/plugins/grok-made"
          test -f "$stage/plugins/grok-made/plugin.json"
          test -f "$stage/plugins/grok-made/hooks/hooks.json"
          test -s "$stage/plugins/grok-made/hooks/bin/made-grok-status${EXE}"
          test -x "$stage/plugins/grok-made/hooks/bin/made-grok-status${EXE}"
          # Source only: no Python hook or test file ships.
          test -z "$(find "$stage/plugins/grok-made" -name '*.py')"
          test ! -e "$stage/plugin"

          node - "$stage" <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const { execSync } = require("node:child_process");

          const stage = process.argv[2];
          const root = process.cwd();
          const workspace = fs.readFileSync(path.join(root, "Cargo.toml"), "utf8");
          const version = /\[workspace\.package\][\s\S]*?version\s*=\s*"([^"]+)"/.exec(workspace);
          const plugin = JSON.parse(
            fs.readFileSync(path.join(root, "plugins", "opencode-made", "package.json"), "utf8"),
          );

          const metadata = {
            name: "made",
            version: version ? version[1] : "unknown",
            profile: "debug",
            target: process.env.TARGET,
            runner_os: process.env.RUNNER_OS,
            runner_arch: process.env.RUNNER_ARCH,
            commit: process.env.GITHUB_SHA,
            ref: process.env.GITHUB_REF_NAME,
            rustc: execSync("rustc --version", { encoding: "utf8" }).trim(),
            cargo: execSync("cargo --version", { encoding: "utf8" }).trim(),
            plugin: { name: plugin.name, version: plugin.version },
            signing: "none",
            notarization: "none",
            installer: "none",
            auto_update: "none",
            companions: {
              layout: "remote/<target>/made-remote",
              targets: [
                "x86_64-unknown-linux-gnu",
                "aarch64-unknown-linux-gnu",
                "x86_64-apple-darwin",
                "aarch64-apple-darwin",
              ],
              askpass: process.env.EXE ? "made-askpass.exe" : "made-askpass",
              runtime_download: "none",
            },
          };
          fs.writeFileSync(
            path.join(stage, "version.json"),
            `${JSON.stringify(metadata, null, 2)}\n`,
          );
          NODE

          find "$stage" -maxdepth 3 -type f -print | sort

      - name: Download Linux x64 companion
        uses: actions/download-artifact@v7
        with:
          name: ssh-companion-x86_64-unknown-linux-gnu
          path: companion-artifacts/x86_64-unknown-linux-gnu

      - name: Download Linux arm64 companion
        uses: actions/download-artifact@v7
        with:
          name: ssh-companion-aarch64-unknown-linux-gnu
          path: companion-artifacts/aarch64-unknown-linux-gnu

      - name: Download macOS x64 companion
        uses: actions/download-artifact@v7
        with:
          name: ssh-companion-x86_64-apple-darwin
          path: companion-artifacts/x86_64-apple-darwin

      - name: Download macOS arm64 companion
        uses: actions/download-artifact@v7
        with:
          name: ssh-companion-aarch64-apple-darwin
          path: companion-artifacts/aarch64-apple-darwin

      - name: Download the native askpass
        uses: actions/download-artifact@v7
        with:
          name: ssh-askpass-${{ matrix.target }}
          path: askpass-artifact

      # Copies the four companions beside made-app. Missing, empty, or
      # hash-mismatched artifacts fail this step. This is workflow-artifact
      # assembly, not a download when the user connects.
      - name: Assemble companions into the desktop package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          EXE: ${{ matrix.exe }}
        run: |
          set -euo pipefail
          if command -v python3 >/dev/null 2>&1; then
            py=python3
          else
            py=python
          fi
          "$py" .github/scripts/assemble-desktop-package.py \
            --stage "dist/made-development-${TARGET}" \
            --companions companion-artifacts \
            --askpass "askpass-artifact/made-askpass${EXE}" \
            --askpass-manifest askpass-artifact/manifest.json \
            --desktop-target "$TARGET"
          find "dist/made-development-${TARGET}" -type f -print | sort

      # The packaged-layout test: the staged hook, from the desktop package,
      # run as Grok runs it (one event, stdin left open) with every PATH entry
      # that provides python or python3 removed. The test binary is built
      # first with the full PATH because linking needs the system toolchain.
      - name: Run the packaged Grok hook with Python removed from PATH
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          EXE: ${{ matrix.exe }}
        run: |
          set -euo pipefail
          cargo test -p made-grok-hook --test packaged --locked --target "$TARGET" --no-run
          hook="$PWD/dist/made-development-${TARGET}/plugins/grok-made/hooks/bin/made-grok-status${EXE}"
          test -x "$hook"
          clean=""
          IFS=':' read -r -a entries <<< "$PATH"
          for entry in "${entries[@]}"; do
            [ -n "$entry" ] || continue
            if [ -e "$entry/python" ] || [ -e "$entry/python3" ] \
              || [ -e "$entry/python.exe" ] || [ -e "$entry/python3.exe" ]; then
              echo "removing from PATH: $entry"
              continue
            fi
            clean="${clean:+$clean:}$entry"
          done
          if [ "$RUNNER_OS" = "Windows" ]; then
            hook="$(cygpath -w "$hook")"
          fi
          PATH="$clean" "$BASH" -c 'command -v python python3 >/dev/null 2>&1 && { echo "python is still on PATH" >&2; exit 1; }; exit 0'
          MADE_PACKAGED_HOOK="$hook" PATH="$clean" \
            bash .github/scripts/temp-annotate.sh "packaged hook" -- cargo test -p made-grok-hook --test packaged --locked --target "$TARGET" -- --nocapture

      - name: Upload the development artifact
        uses: actions/upload-artifact@v7
        with:
          name: made-development-${{ matrix.target }}
          path: dist/made-development-${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 14
