[package]
name = "made-bridge"
description = "Loopback OpenCode bridge and session snapshot protocol for Made"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
getrandom = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tungstenite = "0.30"

[dev-dependencies]
tempfile = "3"
