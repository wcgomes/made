[package]
name = "made-claude-hook"
description = "Native Claude Code session-status hook for the claude-code-made plugin"
version.workspace = true
edition.workspace = true
publish.workspace = true
# Explicit binary: autobins stays off so only the shipped hook executable is built.
autobins = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "made-claude-status"
path = "src/main.rs"

[dependencies]
made-hook-common = { path = "../made-hook-common" }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
