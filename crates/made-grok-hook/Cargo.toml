[package]
name = "made-grok-hook"
description = "Native Grok session-status hook for the grok-made plugin"
version.workspace = true
edition.workspace = true
publish.workspace = true
# Explicit binary: autobins stays off so only the shipped hook executable is built.
autobins = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "made-grok-status"
path = "src/main.rs"

[dependencies]
made-hook-common = { path = "../made-hook-common" }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
