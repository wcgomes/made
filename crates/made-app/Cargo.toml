[package]
name = "made-app"
description = "Native desktop shell for the Made agent workspace"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
made-bridge = { path = "../made-bridge" }
made-explorer = { path = "../made-explorer" }
made-platform = { path = "../made-platform", default-features = true }
made-remote = { path = "../made-remote" }
made-terminal = { path = "../made-terminal" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

# The windowing/GPU/UI stack is confined to `made-app` by `wiki/architecture.md`.
# Default features are off: no accessibility bridge, link handler, persistence, or
# glow backend. X11 and Wayland are both enabled from one source tree.
eframe = { version = "0.37", default-features = false, features = [
    "wgpu",
    "x11",
    "wayland",
    "default_fonts",
    "system_fonts",
    "clipboard",
] }

# Explorer icons are embedded SVGs decoded through egui's image pipeline. Only
# the SVG loader is enabled; no file, HTTP, or raster loader is ever installed.
egui_extras = { version = "0.37", default-features = false, features = ["svg"] }

[build-dependencies]
serde_json = "1"

[dev-dependencies]
tempfile = "3"
tungstenite = "0.30"
